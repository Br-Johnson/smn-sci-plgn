name: Scaffold Validation

on:
  push:
  pull_request:

jobs:
  review-and-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: salmon-data-mobilization/smn-data-pkg
          ref: 6806319c6e88d14064688be7f981e8735269c558
          path: .ci/sdp-spec
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.9.21"
          enable-cache: "false"
      # Acquire the released SDK, EML extras and independent schema checker.
      # These subprocess tests then refuse provider and network operations.
      - name: Replay role boundaries through the actual released package
        run: uv run -q --no-project --with "metasalmonpy[eml] @ git+https://github.com/salmon-data-mobilization/metasalmonpy@v0.6.0" --with "jsonschema==4.26.0" python -B -m unittest discover -s tests -p 'test_semantic_role_replay.py' -v
      - name: Execute the fictional recipe and independent validation
        env:
          SMN_RECIPE_SDP_VALIDATOR: ${{ github.workspace }}/.ci/sdp-spec/scripts/validate_package.py
        run: uv run -q --no-project --with "metasalmonpy[eml] @ git+https://github.com/salmon-data-mobilization/metasalmonpy@v0.6.0" --with "jsonschema==4.26.0" python -B -m unittest discover -s tests -p 'test_local_package_recipe.py' -v

  graph-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Dependency acquisition is separate from the synthetic tests, which
      # refuse network access and only open their disposable admitted stores.
      - run: python -m pip install "smn-data-graph @ git+https://github.com/salmon-data-mobilization/smn-data-graph@4036bad502ac0319e1207f233386ac7f766de2f6#subdirectory=python"
      - run: python -B -m unittest discover -s tests -p 'test_graph_discovery.py' -v

  vocabulary-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # These parsers independently check generated local artifacts. The
      # authoring helper itself remains Python-standard-library only.
      - run: python3 -m pip install rdflib==7.6.0 PyYAML==6.0.3
      - run: python3 -m unittest discover -s tests -p 'test_vocabulary_artifacts.py' -v

  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Structure, both plugin manifests and their agreement, skill names and
      # references, the package pin, and the static check that no skill script
      # reimplements term search.
      - name: Validate scaffold
        run: python3 scripts/validate_scaffold.py

      - name: Run offline regression tests
        if: always()
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  package-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.9.21"
          enable-cache: "false"

      # Installs metasalmonpy from its pinned tag and calls it through both
      # adapters. Needs network access, which is why it is a separate job.
      - name: Run the package adapters against the pinned release
        env:
          SMN_PLUGIN_LIVE_ADAPTERS: "1"
        run: |
          python3 -m unittest discover -s tests -p 'test_package_adapters.py' -v
          python3 -m unittest discover -s tests -p 'test_term_snapshot_controls.py' -v
